name: FoG-Wearable CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run Unit Tests
      run: |
        pytest tests/ -v

    - name: Verify ESP32 Firmware Artifacts
      run: |
        python src/verify_esp32_deployment.py

    - name: Run Hardware Profiling & Benchmark
      run: |
        python src/benchmark_esp32.py
