[platformio]
src_dir = firmware/ESP32_FoG
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<*_host_runner.*>
lib_deps =
    sebastianregelmann/tflite-micro @ 1.26.46
    Wire
build_flags =
    -DFSM_PRESET=1
    -O3

[env:esp32dev_core3]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<*_host_runner.*>
lib_deps =
    sebastianregelmann/tflite-micro @ 1.26.46
    Wire
build_flags =
    -DFSM_PRESET=1
    -O3
